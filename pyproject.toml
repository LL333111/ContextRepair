[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextrepair"
version = "0.1.0"
description = "Failure-conditioned repository re-exploration for LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ContextRepair contributors" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
benchmarks = ["datasets>=2.20"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
contextrepair = "contextrepair.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["contextrepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

